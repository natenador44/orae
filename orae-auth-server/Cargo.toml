[package]
name = "orae-auth-server"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full", "rt-multi-thread"] }
axum = { version = "0.8", features = ["macros", "original-uri", "json", "form"] }
axum-extra = { version = "0.12", features = ["query"] }
tracing = "0.1"
orae-http-server = { git = "https://github.com/natenador44/orae.git" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
